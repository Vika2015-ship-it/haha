<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Открой меня</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(160deg, #f3f3f3, #dcdcdc);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 430px;
    padding: 25px 18px;
    text-align: center;
}

h1 {
    color: #222;
    font-size: 32px;
    margin-bottom: 25px;
}

button {
    border: none;
    padding: 15px 35px;
    border-radius: 14px;
    background: #222;
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: .2s;
}

button:active {
    transform: scale(.94);
}

/* КОНВЕРТ */

.envelope {
    position: fixed;

    width: 240px;
    height: 160px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background: #eeeeee;
    border-radius: 10px;

    box-shadow: 0 15px 40px #0004;

    display: none;
    z-index: 10;
}

.envelope::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    border-left: 120px solid transparent;
    border-right: 120px solid transparent;
    border-top: 90px solid #cccccc;
}

.envelope::after {
    content: "";

    position: absolute;

    left: 15px;
    right: 15px;
    bottom: 15px;

    height: 2px;

    background: #aaa;
}

.fly {
    display: block;

    animation:
        flyAway 1.5s ease-in forwards;
}

@keyframes flyAway {

    0% {
        transform:
            translate(-50%, -50%)
            rotate(0deg)
            scale(1);

        opacity: 1;
    }

    50% {
        transform:
            translate(-50%, -150%)
            rotate(-8deg)
            scale(1.05);

        opacity: 1;
    }

    100% {
        transform:
            translate(-50%, -500%)
            rotate(12deg)
            scale(.7);

        opacity: 0;
    }
}


/* ФОТО */

.photos {
    display: none;

    flex-direction: column;

    gap: 22px;

    width: 100%;

    margin-top: 25px;
}

.showPhotos {
    display: flex;

    animation: appear .8s ease forwards;
}

.photo {
    width: 100%;
    max-width: 390px;

    aspect-ratio: 4 / 5;

    object-fit: cover;

    border-radius: 18px;

    box-shadow: 0 10px 30px #0003;

    background: white;
}

@keyframes appear {

    from {
        opacity: 0;
        transform:
            translateY(50px)
            scale(.9);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* Маленькие телефоны */

@media (max-width: 360px) {

    h1 {
        font-size: 27px;
    }

    .container {
        padding: 20px 14px;
    }

    .photo {
        border-radius: 14px;
    }
}

</style>
</head>


<body>

<div class="container">

    <h1 id="title">
        Открой меня
    </h1>

    <button id="openBtn">
        Открыть
    </button>


    <div class="photos" id="photos">

        <img src="photo1.jpg" class="photo">

        <img src="photo2.jpg" class="photo">

        <img src="photo3.jpg" class="photo">

    </div>

</div>


<div class="envelope" id="envelope"></div>


<script>

const button =
    document.getElementById("openBtn");

const envelope =
    document.getElementById("envelope");

const photos =
    document.getElementById("photos");

const title =
    document.getElementById("title");


button.addEventListener("click", () => {

    button.style.display = "none";

    envelope.classList.add("fly");

    title.innerText = "Для тебя";

    setTimeout(() => {

        photos.classList.add("showPhotos");

    }, 1100);

});

</script>

</body>
</html>
